name: deploy

# Deploys fire only on a v* tag or a manual run — never automatically on a push
# to main. Releasing is a deliberate act: `git tag v1.0.0 && git push origin v1.0.0`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          # Must be a USER-owned token; `pages deploy` calls /memberships, which
          # account-owned tokens cannot authorize (fails with code 10001).
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=saxon-zone --branch=main
