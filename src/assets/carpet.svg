<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1440"
     preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="carpet" width="120" height="120"
             patternUnits="userSpaceOnUse"
             patternTransform="rotate(-30) scale(0.5)">
      <g id="tile" fill="#1c5a86">
        <rect x="56" y="14" width="8" height="92"/>
        <rect x="14" y="56" width="50" height="8"/>
        <rect x="62" y="62" width="34" height="8"/>

        <rect x="90" y="6" width="7" height="7"/>
        <rect x="102" y="18" width="7" height="7"/>
        <rect x="114" y="30" width="7" height="7"/>

        <rect x="40" y="74" width="7" height="7"/>
        <rect x="28" y="86" width="7" height="7"/>
        <rect x="16" y="98" width="7" height="7"/>
      </g>
    </pattern>
  </defs>

  <rect width="1440" height="1440" fill="url(#carpet)"/>
</svg>
